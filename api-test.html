<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUFA API 連線診斷</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;background:#101827;color:#f4f7fc;max-width:750px;margin:40px auto;padding:0 18px}h1{font-size:24px}p{line-height:1.7;color:#b9c7d9}button{background:#77b5ff;border:0;border-radius:9px;padding:12px 18px;font-size:16px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#1e2a3b;padding:18px;border-radius:10px;line-height:1.7}small{color:#afc5db}</style></head><body>
<h1>CUFA PHOTO CONTROL｜API POST 測試</h1>
<p>這個頁面只送出「讀取總覽」的測試請求，使用刻意無效的管理密碼，不會新增、編輯或刪除任何學生資料。正常可連線時，預期會收到 JSON 格式的「管理密碼錯誤」，這代表 POST 已進入 Apps Script。</p>
<button id="test">測試 POST 連線</button>
<p><small>Apps Script：AKfycbxJUp8biTRsMqMAoC1bnkQxXDtYcKlWk5xsClwe_wyxQ4kd9utBba0kJUi0mA4SNf4</small></p>
<pre id="output">尚未執行測試</pre>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxJUp8biTRsMqMAoC1bnkQxXDtYcKlWk5xsClwe_wyxQ4kd9utBba0kJUi0mA4SNf4/exec';
document.getElementById('test').addEventListener('click',async()=>{
 const out=document.getElementById('output'),start=performance.now();
 out.textContent='正在測試跨網域 POST...';
 try{
  const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getDashboard',password:'__CUFA_CONNECTION_TEST_INVALID_PASSWORD__'}),redirect:'follow',cache:'no-store'});
  const contentType=res.headers.get('content-type')||'';
  const body=await res.text();
  const info=['fetch 已取得可讀取回應','HTTP 狀態：'+res.status,'Content-Type：'+contentType,'耗時：'+Math.round(performance.now()-start)+'ms','回應前 1500 字：',body.slice(0,1500)];
  if(contentType.includes('json')){try{const j=JSON.parse(body);info.unshift(j.ok===false&&/密碼/.test(j.error||'')?'結果：POST 通訊已成立；刻意使用無效密碼而遭拒絕（預期結果）':'結果：請檢查 JSON 回應內容');}catch(_){}}
  out.textContent=info.join('\n');
 }catch(err){
  out.textContent=['結果：瀏覽器無法讀取 POST 回應','錯誤：'+String(err),'耗時：'+Math.round(performance.now()-start)+'ms','請按 F12 → Console / Network，查看 POST 狀態碼（例如 401）與是否有 CORS 訊息。','這不表示 Google Sheets 連線測試失敗；兩者是不同階段。'].join('\n');
 }
});
</script></body></html>
