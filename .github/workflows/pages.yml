name: Deploy CUFA Photo Control
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify application
        run: |
          node --check app.js
          node --check schedule.js
          node tests/backend.test.cjs
          node tests/pickup.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static pages
        run: |
          mkdir -p public
          cp index.html admin.html pickup.html api-test.html app.js schedule.js config.js style.css public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
