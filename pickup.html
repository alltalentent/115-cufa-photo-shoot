<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer"><title>CUFA｜學生照片領取</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;color:#ecefe9;background:#151b1d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#27362e 0,transparent 65%),#151b1d}main{max-width:560px;margin:auto;padding:44px 24px 32px}.brand{letter-spacing:.2em;color:#c4d895;font-size:13px;font-weight:700}.photo-icon{width:52px;height:52px;color:#c4d895;margin:32px 0 18px}h1{font-size:34px;line-height:1.3;letter-spacing:.04em;margin:0 0 12px}p{line-height:1.7;margin:0 0 24px;color:#b2bfbb;font-size:17px}.panel{background:#1e2729;border:1px solid #3d4b47;border-radius:18px;padding:28px;margin-top:28px;box-shadow:0 20px 70px #0002}label{display:block;font-size:17px;font-weight:650;margin-bottom:10px}input{width:100%;min-height:58px;border:1px solid #53605b;background:#151c1e;border-radius:9px;color:inherit;font:20px/1.4 inherit;padding:13px 15px;margin-bottom:24px;font-family:inherit;font-size:20px}button,.folder{width:100%;min-height:56px;border:0;border-radius:9px;font-family:inherit;font-size:18px;font-weight:750;cursor:pointer;background:#c4d895;color:#1c291c;padding:14px 20px;display:flex;justify-content:center;align-items:center;text-decoration:none;gap:12px}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e5d895;outline-offset:4px}.hint{font-size:14px;margin:18px 0 0;color:#a4b4ad}.error{color:#ffc0b6;font-size:16px;margin:0 0 18px;white-space:pre-line}.result-name{font-size:28px;color:#ecefe9;margin-bottom:6px}.folder{margin-top:16px;justify-content:space-between}.folder span{font-size:24px}.quiet{background:transparent;color:#c4d895;border:1px solid #53605b;margin-top:24px}footer{font-size:13px;line-height:1.7;color:#94a69d;margin-top:28px;text-align:center}[hidden]{display:none!important}@media(min-width:900px){main{padding-top:64px}}
</style></head><body><main><div class="brand">CUFA · PHOTO COLLECTION</div><svg class="photo-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="10" width="38" height="31" rx="6"/><path d="m10 32 9-10 8 8 5-5 8 10M15 10l3-5h12l3 5"/><circle cx="32" cy="19" r="3"/></svg><h1>領取你的拍攝照片</h1><p>輸入學號與拍攝報到時填寫的手機號碼，<br>開啟自己的照片資料夾。</p>
<section class="panel" id="loginPanel"><form id="pickupForm"><label for="studentId">學號</label><input id="studentId" name="studentId" inputmode="numeric" autocomplete="username" maxlength="8" pattern="[0-9]{8}" placeholder="請輸入 8 碼學號" required><label for="phone">手機號碼</label><input id="phone" name="phone" type="password" inputmode="tel" autocomplete="current-password" maxlength="20" placeholder="拍攝報到時填寫的手機號碼" required><div id="error" class="error" role="alert" aria-live="polite" hidden></div><button id="submit" type="submit">查詢我的照片 <span aria-hidden="true">→</span></button><p class="hint">手機號碼用於核對身分。查詢不到時，請聯絡拍攝工作人員協助確認。</p></form></section>
<section class="panel" id="result" aria-live="polite" hidden tabindex="-1"><h2 class="result-name" id="name"></h2><p id="resultHint"></p><div id="folders"></div><p class="hint">照片會在 Google 雲端硬碟中開啟，可預覽或下載。若出現存取權限提示，請聯絡工作人員。</p><button id="logout" class="quiet" type="button">返回登入</button></section><footer>表演藝術系 · 本次拍攝照片領取</footer></main><script src="config.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);let busy=false;
$('pickupForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('error').hidden=true;$('submit').disabled=true;$('submit').textContent='正在核對資料…';const body={action:'pickupPhotos',studentId:$('studentId').value.trim(),phone:$('phone').value.trim()};const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),25000);try{const response=await fetch(PHOTO_CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body),cache:'no-store',credentials:'omit',signal:ctrl.signal});if(!response.ok)throw Error('暫時無法連線，請稍後再試');let r;try{r=JSON.parse(await response.text());}catch(_){throw Error('暫時無法讀取資料，請稍後再試');}if(!r.ok)throw Error(r.error||'核對失敗，請稍後再試');$('name').textContent=r.data.name+'，你好';$('folders').replaceChildren();for(const folder of r.data.folders||[]){const url=new URL(folder.url);if(url.origin!=='https://drive.google.com'||!/^\/drive\/folders\/[A-Za-z0-9_-]+$/.test(url.pathname))continue;const a=document.createElement('a');a.className='folder';a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='開啟我的'+folder.label;const arrow=document.createElement('span');arrow.setAttribute('aria-hidden','true');arrow.textContent='↗';a.append(arrow);$('folders').append(a);}$('resultHint').textContent=$('folders').children.length?'照片已準備好，請選擇要領取的拍攝類型。':'你的照片尚未上架，請稍後再試或聯絡工作人員。';$('loginPanel').hidden=true;$('result').hidden=false;$('result').focus();}catch(err){$('error').textContent=err.name==='AbortError'?'連線逾時，請稍後再試':err.message;$('error').hidden=false;}finally{clearTimeout(timer);body.phone='';$('phone').value='';busy=false;$('submit').disabled=false;$('submit').textContent='查詢我的照片 →';}};
$('logout').onclick=()=>{$('folders').replaceChildren();$('name').textContent='';$('result').hidden=true;$('loginPanel').hidden=false;$('pickupForm').reset();$('error').hidden=true;$('studentId').focus();};
</script></body></html>
